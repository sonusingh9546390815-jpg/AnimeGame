<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Anime Open World V5 - The Living World</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: Arial, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .top-left { position: absolute; top: 20px; left: 20px; color: white; text-shadow: 2px 2px 4px #000; }
        h1 { margin: 0 0 5px 0; font-size: 20px; text-transform: uppercase; letter-spacing: 2px; }
        .hp-bar-container { display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .hp-bar { width: 150px; height: 12px; background: rgba(0, 0, 0, 0.5); border: 2px solid white; border-radius: 6px; overflow: hidden; }
        .hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #32CD32, #7CFC00); }
        .time-text { margin-top: 5px; color: #FFD700; font-weight: bold; font-size: 14px; }

        .controls { position: absolute; bottom: 30px; width: 100%; pointer-events: auto; }
        
        .joystick-base { position: absolute; left: 40px; bottom: 20px; width: 120px; height: 120px; border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.4) 100%); display: flex; justify-content: center; align-items: center; }
        .joystick-knob { width: 50px; height: 50px; background: rgba(255,255,255,0.8); border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: none; }
        
        .action-buttons { position: absolute; right: 30px; bottom: 10px; display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; width: 150px; justify-content: flex-end; }
        .btn { width: 60px; height: 60px; border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; background: rgba(0,0,0,0.3); color: white; font-weight: bold; font-size: 10px; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn:active { background: rgba(255,255,255,0.6); transform: scale(0.95); }

        /* Sound Play Button */
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; pointer-events: auto; z-index: 100; flex-direction: column; }
        .play-btn { padding: 15px 40px; font-size: 20px; font-weight: bold; background: #FF4500; color: white; border: none; border-radius: 30px; box-shadow: 0 0 15px #FF4500; }
        .intro-text { color: white; margin-top: 15px; font-size: 14px; text-align: center; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="start-screen">
        <button class="play-btn" onclick="startGame()">ENTER WORLD</button>
        <div class="intro-text">Turn on your volume!<br>Experience Wind, Birds & NPCs</div>
    </div>

    <div id="game-container"></div>

    <div id="ui-layer">
        <div class="top-left">
            <h1>Anime World</h1>
            <div class="hp-bar-container">
                <span>HP:</span>
                <div class="hp-bar"><div class="hp-fill"></div></div>
            </div>
            <div class="time-text" id="timeDisplay">Day</div>
        </div>

        <div class="controls">
            <div class="joystick-base" id="joystick"><div class="joystick-knob" id="knob"></div></div>
            <div class="action-buttons">
                <div class="btn" id="btn-run">RUN</div>
                <div class="btn" id="btn-jump">JUMP</div>
            </div>
        </div>
    </div>

    <script>
        // --- SYNTHESIZED NATURE SOUNDS (Wind & River) ---
        let audioCtx;
        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            if(!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const bufferSize = audioCtx.sampleRate * 2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer; noise.loop = true;
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass'; filter.frequency.value = 250; // Wind/River type sound
                
                const gain = audioCtx.createGain(); gain.gain.value = 0.5;
                
                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                noise.start();
            }
        }

        // --- 1. SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('game-container').appendChild(renderer.domElement);

        // --- 2. TEXTURE GENERATOR ---
        function createGrassTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#3cb371'; ctx.fillRect(0, 0, 256, 256);
            for(let i=0; i<500; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#2e8b57' : '#228b22';
                ctx.fillRect(Math.random()*256, Math.random()*256, 2, 8);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(50, 50);
            return tex;
        }

        // --- 3. BUILD THE WORLD ---
        // Zameen (Ground)
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshLambertMaterial({ map: createGrassTexture() }));
        ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

        // Nadi (River)
        const riverGeo = new THREE.PlaneGeometry(60, 600);
        const riverMat = new THREE.MeshPhongMaterial({ color: 0x1E90FF, transparent: true, opacity: 0.8, shininess: 100 });
        const river = new THREE.Mesh(riverGeo, riverMat);
        river.rotation.x = -Math.PI / 2; river.position.set(60, 0.2, 0); 
        scene.add(river);

        // Pahad (Mountains) - Map ke kinare par
        const mountainMat = new THREE.MeshLambertMaterial({ color: 0x556B2F }); // Dark Olive Green
        for(let i=0; i<20; i++) {
            const mGeo = new THREE.ConeGeometry(30 + Math.random()*20, 50 + Math.random()*40, 4);
            const mountain = new THREE.Mesh(mGeo, mountainMat);
            const angle = (i / 20) * Math.PI * 2;
            const radius = 220 + Math.random() * 30; // Door rakhe hain
            mountain.position.set(Math.cos(angle)*radius, 20, Math.sin(angle)*radius);
            scene.add(mountain);
        }

        // Ped (Trees)
        const trunkMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
        const leafMat = new THREE.MeshLambertMaterial({ color: 0x006400 });
        for(let i=0; i<50; i++) {
            let tx = (Math.random() - 0.5) * 300; let tz = (Math.random() - 0.5) * 300;
            if(tx > 30 && tx < 90) continue; // Nadi mein ped nahi
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 4), trunkMat);
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(3, 7, 5), leafMat);
            leaves.position.y = 3.5; tree.add(trunk); tree.add(leaves);
            tree.position.set(tx, 2, tz); scene.add(tree);
        }

        // Ghar/Buildings (Village)
        const houseMat = new THREE.MeshLambertMaterial({ color: 0xF5F5DC }); // Beige
        const roofMat = new THREE.MeshLambertMaterial({ color: 0x8B0000 }); // Red Roof
        for(let i=0; i<5; i++) {
            const house = new THREE.Group();
            const base = new THREE.Mesh(new THREE.BoxGeometry(6, 5, 6), houseMat); base.position.y = 2.5;
            const roof = new THREE.Mesh(new THREE.ConeGeometry(5, 4, 4), roofMat); roof.position.y = 7; roof.rotation.y = Math.PI/4;
            house.add(base); house.add(roof);
            house.position.set(-30 + i*15, 0, -40 + Math.random()*10);
            scene.add(house);
        }

        // --- 4. NPCs (Dost/Log) ---
        const npcs = [];
        const npcColors = [0xffff00, 0xff00ff, 0x00ffff];
        for(let i=0; i<3; i++) {
            const npc = new THREE.Group();
            const nHead = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshLambertMaterial({ color: 0xffcc99 })); nHead.position.y = 2.4;
            const nBody = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 0.5), new THREE.MeshLambertMaterial({ color: npcColors[i] })); nBody.position.y = 1.25;
            npc.add(nHead); npc.add(nBody);
            npc.position.set(-20 + Math.random()*20, 0, -20 + Math.random()*20);
            scene.add(npc);
            npcs.push({ model: npc, angle: Math.random() * Math.PI*2 });
        }

        // --- 5. BIRDS (Asmaan me udte hue) ---
        const birds = [];
        const birdMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
        for(let i=0; i<15; i++) {
            // Bird shape (V shape trick using Cone)
            const bird = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1, 3), birdMat);
            bird.rotation.x = Math.PI / 2; // Sula diya taaki aage ude
            bird.position.set((Math.random()-0.5)*200, 30 + Math.random()*20, (Math.random()-0.5)*200);
            scene.add(bird);
            birds.push({ model: bird, speed: 0.2 + Math.random()*0.2 });
        }

        // --- 6. AIR FLOW (Wind & Leaves Particles) ---
        const particleGeo = new THREE.BufferGeometry();
        const particleCount = 400; // Hawa badha di
        const posArray = new Float32Array(particleCount * 3);
        const colorArray = new Float32Array(particleCount * 3);
        for(let i=0; i<particleCount; i++) {
            posArray[i*3] = (Math.random() - 0.5) * 150; 
            posArray[i*3+1] = Math.random() * 20; 
            posArray[i*3+2] = (Math.random() - 0.5) * 150; 
            // 20% particles hare rang (patte) hain, baki safed (hawa)
            if(Math.random() > 0.8) { colorArray[i*3]=0; colorArray[i*3+1]=1; colorArray[i*3+2]=0; } 
            else { colorArray[i*3]=1; colorArray[i*3+1]=1; colorArray[i*3+2]=1; }
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));
        const particleMat = new THREE.PointsMaterial({ size: 0.25, vertexColors: true, transparent: true, opacity: 0.6 });
        const windParticles = new THREE.Points(particleGeo, particleMat);
        scene.add(windParticles);

        // --- 7. MAIN PLAYER (Aapka Character) ---
        const player = new THREE.Group();
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshLambertMaterial({ color: 0xffcc99 })); head.position.y = 2.4;
        const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 0.5), new THREE.MeshLambertMaterial({ color: 0xff0000 })); body.position.y = 1.25;
        player.add(head); player.add(body);
        player.position.set(0, 0, 0); scene.add(player);

        // --- 8. LIGHTING & DAY/NIGHT ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3); scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffdf80, 1); sunLight.castShadow = true; scene.add(sunLight);
        let timeOfDay = 0; 

        // --- 9. CONTROLS (Joystick Fix & 360 Camera) ---
        let moveX = 0, moveZ = 0; let playerSpeed = 0.15; let isJumping = false, velocityY = 0;
        let camAngleX = Math.PI; let camAngleY = 0.3; let camDistance = 8;
        let rightTouchId = null, lastTouchX = 0, lastTouchY = 0;

        renderer.domElement.addEventListener('touchstart', (e) => {
            for(let i=0; i<e.touches.length; i++) {
                if(e.touches[i].clientX > window.innerWidth / 2) { 
                    rightTouchId = e.touches[i].identifier; lastTouchX = e.touches[i].clientX; lastTouchY = e.touches[i].clientY;
                }
            }
        });

        renderer.domElement.addEventListener('touchmove', (e) => {
            for(let i=0; i<e.touches.length; i++) {
                if(e.touches[i].identifier === rightTouchId) {
                    camAngleX -= (e.touches[i].clientX - lastTouchX) * 0.005; 
                    camAngleY += (e.touches[i].clientY - lastTouchY) * 0.005; 
                    camAngleY = Math.max(-0.1, Math.min(Math.PI/2 - 0.1, camAngleY));
                    lastTouchX = e.touches[i].clientX; lastTouchY = e.touches[i].clientY;
                }
            }
        });

        renderer.domElement.addEventListener('touchend', (e) => {
            for(let i=0; i<e.changedTouches.length; i++) if(e.changedTouches[i].identifier === rightTouchId) rightTouchId = null;
        });

        const joystick = document.getElementById('joystick'), knob = document.getElementById('knob');
        let joyTouchId = null;

        joystick.addEventListener('touchstart', (e) => { e.preventDefault(); joyTouchId = e.changedTouches[0].identifier; });
        joystick.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for(let i=0; i<e.touches.length; i++) {
                if(e.touches[i].identifier === joyTouchId) {
                    const rect = joystick.getBoundingClientRect();
                    const dx = e.touches[i].clientX - (rect.left + rect.width/2), dy = e.touches[i].clientY - (rect.top + rect.height/2);
                    const distance = Math.min(Math.sqrt(dx*dx + dy*dy), 40), angle = Math.atan2(dy, dx);
                    
                    knob.style.transform = `translate(${distance * Math.cos(angle)}px, ${distance * Math.sin(angle)}px)`;
                    
                    let forwardX = Math.sin(camAngleX), forwardZ = Math.cos(camAngleX);
                    let rightX = Math.sin(camAngleX - Math.PI/2), rightZ = Math.cos(camAngleX - Math.PI/2);
                    let joyY = (distance * Math.sin(angle)) / 40, joyX = -(distance * Math.cos(angle)) / 40;  

                    moveX = (forwardX * joyY + rightX * joyX) * playerSpeed;
                    moveZ = (forwardZ * joyY + rightZ * joyX) * playerSpeed;
                    if(Math.abs(moveX)>0 || Math.abs(moveZ)>0) player.rotation.y = Math.atan2(moveX, moveZ);
                }
            }
        });
        joystick.addEventListener('touchend', (e) => {
            e.preventDefault();
            for(let i=0; i<e.changedTouches.length; i++) {
                if(e.changedTouches[i].identifier === joyTouchId) { joyTouchId = null; knob.style.transform = `translate(0px, 0px)`; moveX = moveZ = 0; }
            }
        });

        document.getElementById('btn-jump').addEventListener('touchstart', (e) => { e.preventDefault(); if (!isJumping) { velocityY = 0.35; isJumping = true; } });
        document.getElementById('btn-run').addEventListener('touchstart', (e) => { e.preventDefault(); playerSpeed = 0.4; });
        document.getElementById('btn-run').addEventListener('touchend', (e) => { e.preventDefault(); playerSpeed = 0.15; });

        // --- 10. MAIN ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Day/Night Update
            timeOfDay += 0.002; 
            let sunHeight = Math.sin(timeOfDay);
            sunLight.position.set(Math.cos(timeOfDay)*100, sunHeight*100, 50);
            if(sunHeight > 0) {
                scene.background.setRGB(0.53 * sunHeight, 0.81 * sunHeight, 0.92); sunLight.intensity = sunHeight; document.getElementById('timeDisplay').innerText = "Time: Day";
            } else {
                scene.background.setRGB(0.05, 0.05, 0.15); sunLight.intensity = 0; document.getElementById('timeDisplay').innerText = "Time: Night";
            }
            scene.fog.color.copy(scene.background);

            // Air Flow (Wind) Animation
            const positions = windParticles.geometry.attributes.position.array;
            for(let i=0; i<particleCount; i++) {
                positions[i*3] -= 0.3; // Tej Hawa (X axis)
                positions[i*3+1] -= 0.05; // Neeche aana
                if(positions[i*3] < -75) positions[i*3] = 75;
                if(positions[i*3+1] < 0) positions[i*3+1] = 20;
            }
            windParticles.geometry.attributes.position.needsUpdate = true;

            // NPCs Animation (Wandering)
            npcs.forEach(npc => {
                npc.model.position.x += Math.sin(npc.angle) * 0.02;
                npc.model.position.z += Math.cos(npc.angle) * 0.02;
                npc.model.rotation.y = npc.angle;
                if(Math.random() < 0.01) npc.angle += (Math.random() - 0.5) * 2; // Kabhi kabhi mud jana
            });

            // Birds Animation (Flying)
            birds.forEach(bird => {
                bird.model.position.x += bird.speed;
                if(bird.model.position.x > 150) { bird.model.position.x = -150; bird.model.position.z = (Math.random()-0.5)*200; }
            });

            // Player Movement & Gravity
            player.position.x += moveX; player.position.z += moveZ;
            if (isJumping) {
                player.position.y += velocityY; velocityY -= 0.015; 
                if (player.position.y <= 0) { player.position.y = 0; isJumping = false; velocityY = 0; }
            }

            // Camera Update
            camera.position.x = player.position.x + camDistance * Math.sin(camAngleX) * Math.cos(camAngleY);
            camera.position.y = player.position.y + camDistance * Math.sin(camAngleY) + 2; 
            camera.position.z = player.position.z + camDistance * Math.cos(camAngleX) * Math.cos(camAngleY);
            camera.lookAt(player.position.x, player.position.y + 1.5, player.position.z);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
